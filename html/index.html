<html lang="en">

    <title>ez_consumables</title>

</head>
<body>
<div id="app" class="hidden">

        <div class="window__bg"></div>

            <header class="header">
                <div class="header__side" id="headLeft"></div>
                <div class="header__title"><h1 id="title"></h1></div>

                    <button id="close" class="close framed" data-act="close" aria-label="Close">&#x2715;</button>
                </div>
            </header>
            <nav id="tabs" class="tabs"></nav>
            <div class="divider"></div>
            <main id="body" class="body"></main>
        </div>
    </section>
</div>
<div id="previewBar" class="previewbar hidden"></div>
<div id="toasts" class="toasts"></div>
<script src="app.js"></script>
</body>
</html>
